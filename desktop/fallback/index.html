<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>TipTop Copilot</title>
    <!--
      Bundled with the desktop app and shown for a moment at launch. It hands
      over to the live site as soon as the site answers, so it must stay
      self-contained: no external fonts, styles or scripts.
    -->
    <style>
      :root {
        --bg: #f6f1e4;
        --fg: #1d2b25;
        --fg-muted: #56665e;
        --accent: #2b6d56;
        --accent-hover: #235a47;
        --accent-fg: #ffffff;
        --track: rgba(43, 109, 86, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101a16;
          --fg: #f1ebdc;
          --fg-muted: #a7b3ab;
          --accent: #4f9a7f;
          --accent-hover: #63ad91;
          --accent-fg: #0c1411;
          --track: rgba(79, 154, 127, 0.28);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          system-ui,
          sans-serif;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: block;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        color: var(--fg-muted);
        margin: 0;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 20px auto 0;
        border-radius: 50%;
        border: 3px solid var(--track);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 3s;
        }
      }
      #slow {
        margin-top: 16px;
      }
      button {
        margin-top: 20px;
        font: inherit;
        font-weight: 600;
        color: var(--accent-fg);
        background: var(--accent);
        border: 0;
        border-radius: 999px;
        padding: 10px 22px;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-hover);
      }
      button:focus-visible {
        outline: 3px solid var(--track);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#2b6d56" />
        <g transform="translate(5 9.35) scale(0.15863)" fill="#ffffff">
          <path
            d="M66.2955 26.3643L42.7802 83.8142L20.8093 83.8148L47.122 19.2074H6.98452L0 0H54.6497L66.2955 26.3643Z"
          />
          <path
            d="M72.3906 26.3643L95.9059 83.8142L117.877 83.8148L91.564 19.2074H131.702L138.686 0H84.0363L72.3906 26.3643Z"
          />
        </g>
      </svg>

      <section id="opening" aria-live="polite">
        <h1>Opening TipTop Copilot…</h1>
        <div class="spinner" aria-hidden="true"></div>
        <p id="slow" hidden>Waking up the server. This can take up to a minute.</p>
      </section>

      <section id="offline" aria-live="polite" hidden>
        <h1>Can't reach TipTop Copilot</h1>
        <p>Check your internet connection. This window tries again on its own.</p>
        <button id="retry" type="button">Try again</button>
      </section>
    </main>

    <script>
      const LIVE = 'https://copilot.tiptop.vc';
      const opening = document.getElementById('opening');
      const slow = document.getElementById('slow');
      const offline = document.getElementById('offline');
      const retry = document.getElementById('retry');
      let attempt = 0;
      let retryTimer = 0;

      // Resolves once the live site serves its app icon, which only happens
      // when the web app itself is up (a host error page fails it). An image,
      // not fetch(): a cross-origin image needs no CORS, and the engine never
      // blocks it the way it can block an opaque JSON response.
      function siteAnswers(timeoutMs) {
        return new Promise((resolve, reject) => {
          const probe = new Image();
          const giveUp = setTimeout(() => {
            probe.onload = probe.onerror = null;
            probe.src = '';
            reject(new Error('timed out'));
          }, timeoutMs);
          probe.onload = () => {
            clearTimeout(giveUp);
            resolve();
          };
          probe.onerror = () => {
            clearTimeout(giveUp);
            reject(new Error('no answer'));
          };
          probe.src = LIVE + '/icon-192.png?wake=' + Date.now();
        });
      }

      async function connect() {
        const mine = ++attempt;
        clearTimeout(retryTimer);
        opening.hidden = false;
        offline.hidden = true;
        slow.hidden = true;
        const slowTimer = setTimeout(() => (slow.hidden = false), 4000);
        try {
          // 90 seconds: the server sleeps when idle and can take a minute to wake.
          await siteAnswers(90000);
          if (mine === attempt) location.replace(LIVE + '/today');
        } catch {
          if (mine !== attempt) return;
          opening.hidden = true;
          offline.hidden = false;
          retryTimer = setTimeout(connect, 15000);
        } finally {
          clearTimeout(slowTimer);
        }
      }

      retry.addEventListener('click', connect);
      addEventListener('online', connect);
      connect();
    </script>
  </body>
</html>
