<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>TipTop Kraken</title>
    <!--
      Bundled with the desktop app and shown for a moment at launch. It hands
      over to the live site as soon as the site answers, so it must stay
      self-contained: no external fonts, styles or scripts.
    -->
    <style>
      :root {
        --bg: #f6f1e4;
        --fg: #1d2b25;
        --fg-muted: #56665e;
        --accent: #2b6d56;
        --accent-hover: #235a47;
        --accent-fg: #ffffff;
        --track: rgba(43, 109, 86, 0.18);
        /* The window's top bar: keep in step with --bg-sidebar in
           src/app/globals.css (.dark, and :root.dark .dark below). */
        --bar: #153e31;
        --bar-fg: #eee8d6;
        --bar-hover: rgba(255, 255, 255, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101a16;
          --fg: #f1ebdc;
          --fg-muted: #a7b3ab;
          --accent: #4f9a7f;
          --accent-hover: #63ad91;
          --accent-fg: #0c1411;
          --track: rgba(79, 154, 127, 0.28);
          --bar: #121413;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          system-ui,
          sans-serif;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: block;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        color: var(--fg-muted);
        margin: 0;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 20px auto 0;
        border-radius: 50%;
        border: 3px solid var(--track);
        border-top-color: var(--accent);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 3s;
        }
      }
      #slow {
        margin-top: 16px;
      }
      button {
        margin-top: 20px;
        font: inherit;
        font-weight: 600;
        color: var(--accent-fg);
        background: var(--accent);
        border: 0;
        border-radius: 999px;
        padding: 10px 22px;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-hover);
      }
      button:focus-visible {
        outline: 3px solid var(--track);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      /* The desktop app's main window has no title bar of its own (0.3.0),
         so this page draws a plain one: it moves the window (Tauri's drag
         script) and, on Windows, has the menu and the window buttons. */
      .titlebar {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 1;
        height: 40px;
        display: flex;
        align-items: center;
        background: var(--bar);
        color: var(--bar-fg);
      }
      html[data-os] body {
        padding-top: 64px;
      }
      .titlebar .spacer {
        flex: 1 1 auto;
        align-self: stretch;
      }
      /* Not the page's own buttons below. */
      .titlebar button {
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        width: 46px;
        height: 100%;
        background: transparent;
        color: inherit;
        font: inherit;
        font-weight: 400;
        cursor: default;
      }
      .titlebar button:hover {
        background: var(--bar-hover);
      }
      .titlebar .menu {
        width: 36px;
        height: 28px;
        margin-left: 6px;
        border-radius: 6px;
      }
      .titlebar .close:hover {
        background: #c42b1c;
        color: #ffffff;
      }
      [data-os='mac'] .titlebar .win {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="titlebar" data-tauri-drag-region="deep" hidden>
      <button
        class="win menu"
        type="button"
        tabindex="-1"
        aria-label="Menu"
        title="Menu"
        aria-haspopup="menu"
      >
        <svg
          viewBox="0 0 16 16"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="1"
          shape-rendering="crispEdges"
          aria-hidden="true"
        >
          <path d="M2 3.5h12M2 7.5h12M2 11.5h12" />
        </svg>
      </button>
      <div class="spacer"></div>
      <!-- The glyphs of src/components/desktop/window-glyphs.tsx. -->
      <button
        class="win"
        type="button"
        tabindex="-1"
        aria-label="Minimise"
        title="Minimise"
        data-action="minimize"
      >
        <svg
          viewBox="0 0 10 10"
          width="10"
          height="10"
          fill="none"
          stroke="currentColor"
          stroke-width="1"
          shape-rendering="crispEdges"
          aria-hidden="true"
        >
          <path d="M0 5.5h10" />
        </svg>
      </button>
      <button
        class="win"
        type="button"
        tabindex="-1"
        aria-label="Maximise"
        title="Maximise"
        data-action="toggle-maximize"
      >
        <svg
          data-glyph="maximise"
          viewBox="0 0 10 10"
          width="10"
          height="10"
          fill="none"
          stroke="currentColor"
          stroke-width="1"
          shape-rendering="crispEdges"
          aria-hidden="true"
        >
          <rect x="0.5" y="0.5" width="9" height="9" rx="1" />
        </svg>
        <svg
          data-glyph="restore"
          viewBox="0 0 10 10"
          width="10"
          height="10"
          fill="none"
          stroke="currentColor"
          stroke-width="1"
          shape-rendering="crispEdges"
          aria-hidden="true"
          hidden
        >
          <rect x="0.5" y="2.5" width="7" height="7" rx="1" />
          <path d="M2.5 2.5V0.5h7v7h-2" />
        </svg>
        <svg
          data-glyph="exit"
          viewBox="0 0 10 10"
          width="10"
          height="10"
          fill="none"
          stroke="currentColor"
          stroke-width="1"
          shape-rendering="crispEdges"
          aria-hidden="true"
          hidden
        >
          <path d="M3.5 0.5v3h-3M6.5 0.5v3h3M3.5 9.5v-3h-3M6.5 9.5v-3h3" />
        </svg>
      </button>
      <button
        class="win close"
        type="button"
        tabindex="-1"
        aria-label="Close window"
        title="Close"
        data-action="close"
      >
        <svg
          viewBox="0 0 10 10"
          width="10"
          height="10"
          fill="none"
          stroke="currentColor"
          stroke-width="1"
          aria-hidden="true"
        >
          <path d="M0.5 0.5l9 9M9.5 0.5l-9 9" />
        </svg>
      </button>
    </div>

    <main>
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#2b6d56" />
        <g transform="translate(5 9.35) scale(0.15863)" fill="#ffffff">
          <path
            d="M66.2955 26.3643L42.7802 83.8142L20.8093 83.8148L47.122 19.2074H6.98452L0 0H54.6497L66.2955 26.3643Z"
          />
          <path
            d="M72.3906 26.3643L95.9059 83.8142L117.877 83.8148L91.564 19.2074H131.702L138.686 0H84.0363L72.3906 26.3643Z"
          />
        </g>
      </svg>

      <section id="opening" aria-live="polite">
        <h1>Releasing the Kraken…</h1>
        <div class="spinner" aria-hidden="true"></div>
        <p id="slow" hidden>Waking up the server. This can take up to a minute.</p>
      </section>

      <section id="offline" aria-live="polite" hidden>
        <h1>Can't reach TipTop Kraken</h1>
        <p>Check your internet connection. This window tries again on its own.</p>
        <button id="retry" type="button">Try again</button>
      </section>
    </main>

    <script>
      // The top bar, only inside the desktop app (Tauri's bridge is there).
      // A Mac keeps its traffic lights and menu bar, so it gets the drag area
      // alone. The app's own commands, allowed for this page and the main
      // window only (src-tauri/capabilities/).
      (function () {
        const agent = navigator.userAgent;
        const os = /Windows/.test(agent) ? 'windows' : /Mac/.test(agent) ? 'mac' : '';
        const tauri = window.__TAURI_INTERNALS__;
        if (!os || !tauri || typeof tauri.invoke !== 'function') return;
        const bar = document.querySelector('.titlebar');
        const maximise = bar.querySelector('[data-action="toggle-maximize"]');
        const invoke = (cmd, args) => {
          try {
            return Promise.resolve(tauri.invoke(cmd, args)).catch(() => null);
          } catch {
            return Promise.resolve(null);
          }
        };
        // In full screen the bar never drags (nor maximises on a
        // double-click), and its maximise button leaves full screen; a
        // maximised window's restores, as on the live page.
        const refresh = () =>
          invoke('window_frame', {}).then((frame) => {
            const full = !!frame && frame.fullscreen === true;
            const maximised = !full && !!frame && frame.maximized === true;
            const glyph = full ? 'exit' : maximised ? 'restore' : 'maximise';
            bar.dataset.tauriDragRegion = full ? 'false' : 'deep';
            maximise.dataset.action = full ? 'exit-full-screen' : 'toggle-maximize';
            maximise.title = full ? 'Exit full screen' : maximised ? 'Restore' : 'Maximise';
            maximise.setAttribute('aria-label', maximise.title);
            for (const svg of maximise.querySelectorAll('[data-glyph]')) {
              svg.toggleAttribute('hidden', svg.dataset.glyph !== glyph);
            }
          });
        document.documentElement.dataset.os = os;
        bar.hidden = false;
        for (const button of bar.querySelectorAll('button')) {
          // Keeps the keyboard where it was, as the system's buttons do.
          button.addEventListener('mousedown', (event) => event.preventDefault());
        }
        // Told on the press and asked for on the click: the shell opens the
        // menu for a click only if it saw the press on ☰ while Windows still
        // reported the mouse button down, which a script cannot fake.
        const askForMenu = (event) => {
          if (event.button !== 0) return;
          invoke('show_app_menu', {
            x: Math.round(event.currentTarget.getBoundingClientRect().left),
            y: Math.round(bar.getBoundingClientRect().bottom),
          });
        };
        bar.querySelector('.menu').addEventListener('mousedown', askForMenu);
        bar.querySelector('.menu').addEventListener('click', askForMenu);
        for (const button of bar.querySelectorAll('[data-action]')) {
          button.addEventListener('click', () =>
            invoke('window_control', { action: button.dataset.action }).then(refresh),
          );
        }
        addEventListener('resize', refresh);
        refresh();
      })();

      const LIVE = 'https://copilot.tiptop.vc';
      const opening = document.getElementById('opening');
      const slow = document.getElementById('slow');
      const offline = document.getElementById('offline');
      const retry = document.getElementById('retry');
      let attempt = 0;
      let retryTimer = 0;

      // Resolves once the live site serves its app icon, which only happens
      // when the web app itself is up (a host error page fails it). An image,
      // not fetch(): a cross-origin image needs no CORS, and the engine never
      // blocks it the way it can block an opaque JSON response.
      function siteAnswers(timeoutMs) {
        return new Promise((resolve, reject) => {
          const probe = new Image();
          const giveUp = setTimeout(() => {
            probe.onload = probe.onerror = null;
            probe.src = '';
            reject(new Error('timed out'));
          }, timeoutMs);
          probe.onload = () => {
            clearTimeout(giveUp);
            resolve();
          };
          probe.onerror = () => {
            clearTimeout(giveUp);
            reject(new Error('no answer'));
          };
          probe.src = LIVE + '/icon-192.png?wake=' + Date.now();
        });
      }

      async function connect() {
        const mine = ++attempt;
        clearTimeout(retryTimer);
        opening.hidden = false;
        offline.hidden = true;
        slow.hidden = true;
        const slowTimer = setTimeout(() => (slow.hidden = false), 4000);
        try {
          // 90 seconds: the server sleeps when idle and can take a minute to wake.
          await siteAnswers(90000);
          if (mine === attempt) location.replace(LIVE + '/today');
        } catch {
          if (mine !== attempt) return;
          opening.hidden = true;
          offline.hidden = false;
          retryTimer = setTimeout(connect, 15000);
        } finally {
          clearTimeout(slowTimer);
        }
      }

      retry.addEventListener('click', connect);
      addEventListener('online', connect);
      connect();
    </script>
  </body>
</html>
