# Desktop alerts (src/alerts.rs). capabilities/desktop-alerts.json says which
# pages may use them.

[[permission]]
identifier = "allow-desktop-alerts"
description = "Turn desktop alerts on or off for this computer, read whether they are on and allowed, ask the system for permission, and show the fixed test notification. Never reads the token back; never shows text a page supplies."
commands.allow = ["alerts_state", "alerts_request_permission", "alerts_turn_on", "alerts_turn_off", "alerts_test"]
