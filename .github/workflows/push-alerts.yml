# Phone alerts for Nick (Web Push).
#
# One run loops through the day: every minute it asks the app for meetings
# starting in about five minutes (GET /api/cron/push?scope=meetings), and every
# half hour for everything else, then signs and sends them with the VAPID
# private key held here as the VAPID_PRIVATE_KEY secret.
#
# GitHub starts scheduled runs late (sometimes hours), so the loop never
# stops between days: outside 6am-9pm Central it waits without calling the
# app, and after 5.5 hours it starts its own successor ("Hand over" below),
# which waits in the concurrency queue until this run ends. The hourly
# schedule is only a backup that restarts the chain if it ever breaks; a
# scheduled run that finds a loop going just waits its turn.
#
# Until VAPID_PRIVATE_KEY is added this job is a no-op, not a failure (and
# does not hand over, so it cannot spin).

name: push-alerts

on:
  schedule:
    - cron: '3 * * * *'
  # A change to the sender queues a run with the new code behind the one
  # looping now, so it takes over without waiting for the schedule.
  push:
    branches: [master]
    paths:
      - .github/workflows/push-alerts.yml
      - scripts/push-alerts.mjs
  workflow_dispatch:

permissions:
  contents: read
  # Only to start the next run of this workflow.
  actions: write

concurrency:
  group: push-alerts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Wake the service
        run: |
          curl -sS -o /dev/null -w 'wake: HTTP %{http_code} in %{time_total}s\n' \
            --max-time 180 --retry 3 --retry-delay 20 --retry-all-errors \
            "${APP_URL}/login" || echo "wake failed; continuing anyway"
        env:
          APP_URL: ${{ vars.APP_URL || 'https://tiptop-copilot.onrender.com' }}

      - name: Install the sender
        # Only this job sends, so web-push stays out of package.json and the
        # app's dependency tree: a scratch folder with just the script.
        run: |
          mkdir -p "${RUNNER_TEMP}/sender"
          cp scripts/push-alerts.mjs "${RUNNER_TEMP}/sender/"
          cd "${RUNNER_TEMP}/sender"
          npm init -y >/dev/null
          npm install --no-audit --no-fund web-push@3.6.7

      - name: Send alerts every minute
        id: send
        run: node "${RUNNER_TEMP}/sender/push-alerts.mjs"
        env:
          APP_URL: ${{ vars.APP_URL || 'https://tiptop-copilot.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # Under the 350-minute job limit, leaving time to hand over.
          LOOP_MAX_MINUTES: '330'
          LOOP_FROM_HOUR: '6'
          LOOP_UNTIL_HOUR: '21'

      - name: Hand over to the next run
        # Set only when the loop reached its run limit: a run that exited
        # early (no key, bad secret) or was cancelled does not chain.
        if: always() && steps.send.outputs.handover == 'true'
        run: gh workflow run push-alerts.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
