# Phone alerts for Nick (Web Push).
#
# Every 30 minutes in the daytime, ask the app which alerts are due
# (GET /api/cron/push) and send them with the VAPID private key held here as
# the VAPID_PRIVATE_KEY secret. The app also refuses to alert outside 8am-8pm
# in the owner's timezone, so a late-starting run cannot ping at night.
#
# Until VAPID_PRIVATE_KEY is added this job is a no-op, not a failure.

name: push-alerts

on:
  schedule:
    # 13:00-01:30 UTC covers 8am-8pm Central in daylight and standard time.
    # GitHub often starts these late; that only delays an alert.
    - cron: '7,37 13-23 * * *'
    - cron: '7,37 0-1 * * *'
  workflow_dispatch:

concurrency:
  group: push-alerts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Wake the service
        run: |
          curl -sS -o /dev/null -w 'wake: HTTP %{http_code} in %{time_total}s\n' \
            --max-time 180 --retry 3 --retry-delay 20 --retry-all-errors \
            "${APP_URL}/login" || echo "wake failed; continuing anyway"
        env:
          APP_URL: ${{ vars.APP_URL || 'https://tiptop-copilot.onrender.com' }}

      - name: Install the sender
        # Only this job sends, so web-push stays out of package.json and the
        # app's dependency tree: a scratch folder with just the script.
        run: |
          mkdir -p "${RUNNER_TEMP}/sender"
          cp scripts/push-alerts.mjs "${RUNNER_TEMP}/sender/"
          cd "${RUNNER_TEMP}/sender"
          npm init -y >/dev/null
          npm install --no-audit --no-fund web-push@3.6.7

      - name: Send due alerts
        run: node "${RUNNER_TEMP}/sender/push-alerts.mjs"
        env:
          APP_URL: ${{ vars.APP_URL || 'https://tiptop-copilot.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
