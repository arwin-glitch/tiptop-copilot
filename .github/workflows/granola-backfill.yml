# Keeps the app's meeting notes level with Granola.
#
# Runs every half hour as a catch-up, and on demand for a full import. A
# catch-up asks Granola for everything changed since shortly before the newest
# meeting already stored, so a routine run is one request, not nine hundred.
#
# It asks by time, never by position. The first version of this assumed Granola
# returns notes newest first and stopped once two pages held nothing new;
# Granola documents no such order, so the run stopped on page two of old
# history every time and fetched nothing for three days while every check
# stayed green.
#
# At :17 and :47 rather than :00 and :30. GitHub's scheduler is best-effort and
# queues shared runners; the top and half of the hour are the two most
# contended minutes there are, and a job asked for then is the most likely to
# be delayed or dropped. Odd offsets are consistently more punctual.
#
# This exists because webhook delivery cannot be relied on while the app is on
# a free instance that sleeps after fifteen minutes: a delivery arriving at a
# cold server gets no answer in time. Polling has no such deadline. If the app
# ever moves to an always-on instance, the webhook becomes the live path and
# this can drop to a daily safety net.
#
# Scheduled runs need the repository variable GRANOLA_BACKFILL=enabled, so the
# schedule ships dormant rather than failing twice an hour before the secrets
# exist. The manual button always works.
#
#   Settings -> Secrets and variables -> Actions
#     Variables: GRANOLA_BACKFILL = enabled
#     Secrets:   GRANOLA_WEBHOOK_URL  (the webhook URL including ?token=)

name: granola-backfill

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Note pages per request (each page is up to 30 notes)'
        required: false
        default: '1'
      full:
        description: 'Full import — walk the entire history, not just what is new'
        type: boolean
        required: false
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name == 'workflow_dispatch' || vars.GRANOLA_BACKFILL == 'enabled' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: node scripts/granola-backfill.mjs
        env:
          GRANOLA_WEBHOOK_URL: ${{ secrets.GRANOLA_WEBHOOK_URL }}
          PAGES: ${{ inputs.pages || '1' }}
          # Unset on a scheduled run, which is always a catch-up.
          FULL: ${{ inputs.full }}
