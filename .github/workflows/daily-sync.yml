# The daily job: sync every connected mailbox, renew the Gmail push
# registration, and generate the outlook.
#
# New mail does not depend on this. Gmail pushes to Pub/Sub, which calls
# /api/integrations/google/gmail-push, and the app syncs the delta within
# seconds. This runs once a morning for three reasons:
#
#   1. The outlook is a once-a-day artefact and a deep-tier model call. It is
#      the largest cost in the system once an API key exists, and regenerating
#      it on a poll would be roughly forty a day per organization.
#   2. `users.watch` lapses after seven days — Google's limit, not a setting —
#      and a lapsed registration stops delivering silently. A mailbox that has
#      stopped notifying looks exactly like a quiet mailbox. This renews it.
#   3. It is the safety net if push ever stops: a full sync still runs daily.
#
# So the schedule is not redundant with push. It is what keeps push alive.

name: daily

on:
  schedule:
    # 11:00 UTC every day, weekends included — 06:00 in America/Chicago during daylight saving,
    # 05:00 outside it. GitHub's scheduler is UTC only and does not follow DST.
    - cron: '0 11 * * *'
    # 21:30 and 22:30 UTC every day, weekends included: one of them is about 16:30 in
    # America/Chicago in daylight saving and standard time alike, after the 3pm task-closer.
    # These runs are mail sync plus the Slack-relay pickup only (tasks=sync below), so a
    # company the portfolio-auto-add routine spots at its ~15:30 run reaches the Portfolio
    # page the same day. GitHub often starts them late; page views are the main path.
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      tasks:
        description: 'all (includes the outlook) or sync (mail and watch only)'
        required: false
        default: all
        type: choice
        options: [all, sync]

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the service
        # The free Render instance sleeps after 15 minutes idle and takes about
        # 50 seconds to return. Waking it with a cheap unauthenticated GET means
        # the real request is not the one paying for the cold start.
        run: |
          curl -sS -o /dev/null -w 'wake: HTTP %{http_code} in %{time_total}s\n' \
            --max-time 180 --retry 3 --retry-delay 20 --retry-all-errors \
            "${APP_URL}/login" || echo "wake failed; continuing anyway"
        env:
          APP_URL: ${{ vars.APP_URL || 'https://tiptop-copilot.onrender.com' }}

      - name: Run the job
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not set as a repository secret. The endpoint will reject this."
            exit 1
          fi

          echo "tasks=${TASKS}"

          status=$(curl -sS -X POST "${APP_URL}/api/cron/daily?tasks=${TASKS}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 300 \
            -o response.json -w '%{http_code}')

          echo "HTTP ${status}"
          echo '--- response ---'
          cat response.json || true
          echo

          # A non-2xx is a real failure and should look like one. A scheduled
          # job that quietly stops running is worse than one that never existed,
          # because everyone assumes it is working.
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Job failed with HTTP ${status}"
            exit 1
          fi
        env:
          APP_URL: ${{ vars.APP_URL || 'https://tiptop-copilot.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TASKS: ${{ github.event.inputs.tasks || (github.event.schedule == '0 11 * * *' && 'all') || 'sync' }}

      - name: Sync Affinity
        # Everything in Affinity, copied into Copilot every morning until the
        # subscription is cancelled (then delete AFFINITY_API_KEY on Render, or
        # this step). Morning run and manual runs only: once a day is plenty.
        #
        # A full pull does not fit in one request, so the endpoint does a
        # bounded chunk per call and answers done:false until the run is in;
        # this loops. A run cut short (the loop cap, a failure) resumes from
        # where it stopped on the next call, here or from "Sync now".
        #
        # The repository is public, so this prints counts only: jq picks the
        # booleans, the phase and the numbers out of the response, and the body
        # itself is never echoed.
        #
        # When Affinity refuses the key (revoked, or the subscription ended),
        # the endpoint answers done:true, stopped:true: the sync stopped
        # cleanly, so this step ends green with one line saying so, every
        # morning, until the key is replaced or deleted.
        # Runs even when the mail job above failed: the two are independent.
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *') }}
        run: |
          set -euo pipefail

          summary() {
            jq -c '{
              configured: (.configured == true),
              done: (.done == true),
              stopped: (.stopped == true),
              busy: (.busy == true),
              phase: (if (.phase | IN("lists", "notes", "done")) then .phase else null end),
              lists: [(.listsDone // 0 | numbers), (.listsTotal // 0 | numbers)],
              rows: (.counts.entries // {} | with_entries(select(.value | type == "number"))),
              records: (.counts.records // {} | with_entries(select(.value | type == "number"))),
              notes: (.counts.notes // {} | with_entries(select(.value | type == "number"))),
              skipped: [(.counts.pagesSkipped // 0 | numbers), (.counts.refused // 0 | numbers)],
              requests: (.counts.requests // 0 | numbers)
            }' affinity.json 2>/dev/null || echo '(unreadable response)'
          }

          # A failed call is tried again twice, 30s apart, before the job gives
          # up: the sync counts a page that keeps failing across calls and
          # moves past it on the third, which then happens this morning
          # rather than over three days.
          failed=0
          for call in $(seq 1 80); do
            status=$(curl -sS -X POST "${APP_URL}/api/cron/affinity-sync" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              --max-time 150 \
              -o affinity.json -w '%{http_code}') || status=000

            if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
              code=$(jq -r '.error.code // "unknown" | select(test("^[a-z_]+$"))' affinity.json 2>/dev/null || echo unknown)
              rm -f affinity.json
              failed=$((failed + 1))
              if [ "${failed}" -lt 3 ]; then
                echo "call ${call}: HTTP ${status} (${code:-unknown}); trying again in 30s."
                sleep 30
                continue
              fi
              echo "::error::Affinity sync failed with HTTP ${status} (${code:-unknown}). It resumes from where it stopped on the next run."
              exit 1
            fi
            failed=0

            echo "call ${call}: $(summary)"

            if [ "$(jq -r '.configured == false' affinity.json)" = "true" ]; then
              echo "AFFINITY_API_KEY is not set on Render; nothing to sync."
              break
            fi
            if [ "$(jq -r '.stopped == true' affinity.json)" = "true" ]; then
              echo "Affinity refused the API key, so the sync is stopped; nothing to do until the key is replaced (Knowledge > Affinity import)."
              break
            fi
            if [ "$(jq -r '.done == true' affinity.json)" = "true" ]; then
              break
            fi
            if [ "$(jq -r '.busy == true or .rateLimited == true' affinity.json)" = "true" ]; then
              sleep 20
            fi
          done

          if [ "$(jq -r '.done == true' affinity.json 2>/dev/null || echo false)" != "true" ]; then
            echo "::notice::The Affinity sync is not finished yet; it carries on from here on the next run."
          fi
          rm -f affinity.json
        env:
          APP_URL: ${{ vars.APP_URL || 'https://tiptop-copilot.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
