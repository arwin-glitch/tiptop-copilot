# Calls the app's scheduled job: sync every connected mailbox, then
# pre-generate the daily outlook.
#
# The job itself lives at /api/cron/daily and has existed since the first
# commit. Nothing ever called it — it refuses unauthenticated callers by
# design, and no scheduler was configured, so every sync was a button press.
#
# GitHub Actions rather than Render Cron because Render's cron jobs run on paid
# instances, and rather than an external pinger because that would mean handing
# CRON_SECRET to a third party.
#
# UNVERIFIED until its first scheduled run. Use "Run workflow" on the Actions
# tab to test it now rather than waiting until tomorrow.

name: daily sync

on:
  schedule:
    # 11:00 UTC on weekdays — 06:00 in America/Chicago during daylight saving,
    # 05:00 outside it. GitHub's scheduler is UTC only and does not follow DST,
    # so this drifts by an hour twice a year. Adjust the hour if that matters;
    # it is a brief, not a market open.
    - cron: '0 11 * * 1-5'
  # So it can be run by hand, which is also how you test it.
  workflow_dispatch:

# Never let two runs overlap. A sync is idempotent, but two concurrent ones on a
# free instance with 512MB is a waste of a cold start.
concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the service
        # The free Render instance sleeps after 15 minutes idle and takes about
        # 50 seconds to come back. Waking it with a cheap unauthenticated GET
        # first means the real request is not the one paying for the cold start.
        run: |
          curl -sS -o /dev/null -w 'wake: HTTP %{http_code} in %{time_total}s\n' \
            --max-time 180 --retry 3 --retry-delay 20 --retry-all-errors \
            "${APP_URL}/login" || echo "wake failed; continuing anyway"
        env:
          APP_URL: ${{ vars.APP_URL || 'https://tiptop-copilot.onrender.com' }}

      - name: Run the daily job
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not set as a repository secret. The endpoint will reject this."
            exit 1
          fi

          status=$(curl -sS -X POST "${APP_URL}/api/cron/daily" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 300 \
            -o response.json -w '%{http_code}')

          echo "HTTP ${status}"
          echo '--- response ---'
          cat response.json || true
          echo

          # A non-2xx is a real failure and should show as one: a scheduled job
          # that quietly stops running is worse than one that never existed,
          # because everyone assumes it is working.
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Daily job failed with HTTP ${status}"
            exit 1
          fi
        env:
          APP_URL: ${{ vars.APP_URL || 'https://tiptop-copilot.onrender.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
