<!doctype html>
<!-- A fictional company's own careers page (Acme Robotics), with its roles

     address and number here is invented. -->
<html lang="en">

    <meta charset="utf-8" />
    <title>Careers at Acme Robotics</title>

        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Acme Robotics",
        "url": "https://acme-robotics.example.com"
      }
    </script>
