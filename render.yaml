# Render Blueprint — TipTop Copilot.
#
# Two services from one repository:
#
#   tiptop-copilot-demo   DEMO_MODE=true    fictional data, no login, shareable
#   tiptop-copilot        DEMO_MODE unset   real data, sign-in required
#
# They are deliberately separate rather than one service with a flag, because
# the demo's whole value is that it can be handed to someone with no
# credentials, and the real deployment's whole value is that it cannot.
#
# Render runs the app as an ordinary Node process (`next start`), not through a
# serverless adapter.

services:
  # ────────────────────────────────────────────────────────────── demo ──
  #
  # Demo mode uses a file-backed store and a deterministic offline model, so it
  # needs no Supabase, no Google OAuth and no Anthropic key. Every company,
  # person and number it shows is fictional.
  #
  # It has NO AUTHENTICATION: anyone who reaches the URL gets a workspace. That
  # is acceptable only because the data is invented. Never point this service at
  # a real credential.
  #
  # Its disk is ephemeral, so a redeploy resets the fixtures. That is intended.
  - type: web
    name: tiptop-copilot-demo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:demo
    # /api/health requires a session, so it cannot serve as the health check.
    # /login is dynamic, unauthenticated and cheap.
    healthCheckPath: /login
    envVars:
      # Parity with the toolchain the suites were verified against. If Render
      # cannot fetch this exact version, 22 also satisfies `engines`.
      - key: NODE_VERSION
        value: 24.19.0

      # DEMO_MODE is read server-side only; nothing in the app reads a
      # NEXT_PUBLIC_ variant, so it is not set here. (An earlier version of this
      # file claimed it was inlined at build time and therefore required. It
      # is not, and it never was.)
      - key: DEMO_MODE
        value: 'true'

      # Signs the session cookie; at least 32 characters. Entered in the Render
      # dashboard, never committed — `sync: false` is what keeps it out of this
      # file. Without it, demo mode substitutes an ephemeral key and sessions
      # drop on every restart.
      - key: SESSION_SECRET
        sync: false

  # ────────────────────────────────────────────────────────────── real ──
  #
  # Every value below is `sync: false`: entered in the Render dashboard, never
  # in this file. The repository is public.
  #
  # DEMO_MODE is deliberately ABSENT rather than set to 'false'. The app reads
  # it as a boolean defaulting to false, so absence is the safe state — and a
  # variable that is not here cannot be flipped to 'true' by an edit to this
  # file and quietly serve fixtures to a fund.
  #
  # Without SUPABASE_SERVICE_ROLE_KEY the app now refuses to start a database or
  # storage session rather than falling back to the demo store. A failed boot is
  # the intended outcome; invented companies presented as real is not.
  - type: web
    name: tiptop-copilot
    runtime: node
    plan: free
    # Must match the Supabase project's region. Every page runs several queries
    # in sequence server-side, so a cross-region gap is paid repeatedly per
    # request — it costs far more than the distance from any one user to the
    # app, which is a single round trip. Ohio pairs with Supabase us-east-2 and
    # is the nearest free region to the daily user in Texas.
    #
    # Neither Render nor Supabase can move a service between regions. Changing
    # this means deleting the service and letting the Blueprint recreate it.
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 24.19.0

      # Public origin. Used to build both OAuth redirect URIs, so it must match
      # the Render URL exactly — a mismatch fails sign-in with a provider error
      # that says nothing useful.
      - key: APP_URL
        sync: false

      # Signs the session cookie. At least 32 characters.
      - key: SESSION_SECRET
        sync: false

      # AES-256-GCM key for stored Google tokens. Must decode to exactly 32
      # bytes of base64. Losing it means every Google connection is
      # re-established from scratch; there is no re-encryption path, by design.
      - key: APP_ENCRYPTION_KEY
        sync: false

      # Database. Without the service role key the app refuses to start.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Who may sign in, e.g. tiptop.vc. Empty means anyone who completes Google
      # sign-in is given their own workspace, because the database provisions an
      # organization for every new user. Set this before the URL reaches anyone.
      - key: AUTH_ALLOWED_EMAIL_DOMAINS
        sync: false

      # Gmail and Calendar. Optional: without them those surfaces report
      # themselves as not connected rather than failing.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # The only variable here that costs money. Without it every AI surface
      # reports itself unavailable — it does not fabricate, and it does not fall
      # back to the demo model.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Authenticates the scheduled daily job. Without it that endpoint rejects
      # every caller, which is the correct failure.
      - key: CRON_SECRET
        sync: false

      # Authenticates Zapier's Granola meeting-note deliveries. Optional:
      # without it the webhook rejects every caller and notes do not arrive.
      - key: GRANOLA_WEBHOOK_SECRET
        sync: false
